// Android-only settings, kept apart so the web app builds without Android's
// Gradle plugin (see build.gradle.kts). The shared code is an Android
// library; the installable app is :androidApp.
kotlin {
    android {
        namespace 'tw.tripshare.shared'
        compileSdk 37
        minSdk 24
        androidResources { enable true }
    }
}

// Android's account picker, for linking a Google account.
kotlin.sourceSets.getByName('androidMain').dependencies {
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
