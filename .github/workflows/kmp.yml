name: Kotlin rewrite

# Builds the Compose Multiplatform version in kmp/ (Android + web), reports
# its size and puts the web build on a temporary preview link. It never
# touches the live site or the testers' Android app.
on:
  pull_request:
    paths:
      - 'kmp/**'
      - '.github/workflows/kmp.yml'
  workflow_dispatch:

concurrency:
  group: kmp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Build Kotlin app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew --no-daemon :core:jvmTest :androidApp:assembleRelease :composeApp:wasmJsBrowserDistribution
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Lists the build's files in sw.js so the web app opens offline.
      - run: node tools/offline.mjs composeApp/build/dist/wasmJs/productionExecutable
      - name: Sizes
        run: |
          command -v brotli >/dev/null || sudo apt-get install -y -qq brotli
          apk=$(ls androidApp/build/outputs/apk/release/*.apk | head -1)
          web=composeApp/build/dist/wasmJs/productionExecutable
          {
            echo "## Kotlin 版大小"
            echo "| 項目 | 大小 |"
            echo "|---|---|"
            echo "| Android APK | $(du -k "$apk" | cut -f1) KB |"
            echo "| 網頁全部檔案 | $(du -sk $web | cut -f1) KB |"
            echo "| 網頁首次下載（brotli 後，不含 .map） | $(cd $web && for f in $(find . -type f ! -name '*.map' ! -name '*.txt'); do brotli -c -q 11 "$f" | wc -c; done | awk '{s+=$1} END {print int(s/1024)}') KB |"
            echo
            echo '```'
            echo "原始KB  brotliKB  檔案"
            (cd $web && find . -type f ! -name '*.map' | while read -r f; do
              printf '%7d %9d  %s\n' $(( $(stat -c%s "$f") / 1024 )) $(( $(brotli -c -q 11 "$f" | wc -c) / 1024 )) "$f"
            done | sort -rn | head -20)
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Opens the web build at phone and desktop sizes; fails on a start-up crash.
      - name: Web smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null && npm install --silent playwright@1.56.1
          cp "$GITHUB_WORKSPACE/kmp/tools/smoke.mjs" .
          (cd "$GITHUB_WORKSPACE/kmp/composeApp/build/dist/wasmJs/productionExecutable" && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          node smoke.mjs http://localhost:8080/ "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-web-screenshots
          path: ${{ runner.temp }}/smoke/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-android-apk
          path: kmp/androidApp/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-web
          path: kmp/composeApp/build/dist/wasmJs/productionExecutable

  preview:
    name: Web preview link
    needs: kotlin
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: kotlin-web
          path: kmp/composeApp/build/dist/wasmJs/productionExecutable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g firebase-tools
      # A preview channel is a separate, expiring address; the live site
      # tripshare-tw.web.app is not changed.
      - name: Deploy preview channel
        working-directory: kmp
        run: |
          key="$RUNNER_TEMP/service-account.json"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key")
          GOOGLE_APPLICATION_CREDENTIALS="$key" firebase hosting:channel:deploy kotlin \
            --config firebase.preview.json --project tripshare-f6209 \
            --only tripshare-tw --expires 30d --non-interactive --json > "$RUNNER_TEMP/out.json"
          url=$(node -e "const r=require('$RUNNER_TEMP/out.json').result;console.log(Object.values(r)[0].url)")
          echo "## 網頁預覽：$url" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Preview $url"
