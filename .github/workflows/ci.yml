name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Sends main to testers again without a version bump, for a distribute
  # job that failed for a reason outside the code (the Mac asleep, a
  # keychain problem). Run it from the Actions tab on main.
  workflow_dispatch:
    inputs:
      platform:
        description: Which build to send (both = Android and web)
        type: choice
        options: [both, android, web]
        default: both

jobs:
  # The app is the Kotlin version in kmp/. Its full Android and web builds
  # run on pull requests in kmp.yml; here only the shared logic's tests,
  # which need no Android SDK.
  test:
    name: Kotlin tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew --no-daemon -Ptripshare.android=false :core:jvmTest

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # firebase-tools needs Java 21 or later for the emulator.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm install
        working-directory: test/rules
      - run: npm test
        working-directory: test/rules

  # Did this push to main change versionCode in kmp/version.properties?
  # Raising it is what ships a build to testers; other pushes don't.
  version:
    name: Version changed
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: compare
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(sed -n 's/^versionCode=//p' kmp/version.properties)
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            was=$(git show "$BEFORE:kmp/version.properties" 2>/dev/null | sed -n 's/^versionCode=//p')
          else
            was=
          fi
          echo "version: ${was:-unknown} -> $now"
          if [ "$was" = "$now" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $now unchanged; not distributing"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Every push to main publishes main's firestore.rules once the rules
  # tests pass, so a rules change can't be merged and forgotten: a write the
  # live rules refuse is dropped without anyone seeing an error. Setup (the
  # service account's roles) is in README → 發布設定.
  deploy-rules:
    name: Deploy Firestore rules
    needs: [rules]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-rules
      cancel-in-progress: false
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - name: Check secrets
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is not set"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g firebase-tools
      - name: Deploy
        run: |
          key="$RUNNER_TEMP/service-account.json"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key")
          GOOGLE_APPLICATION_CREDENTIALS="$key" \
            firebase deploy --only firestore:rules --non-interactive

  # iPhone friends use the web build from the home screen instead of a
  # signed iOS app. It ships with the same version bump as Android.
  deploy-web:
    name: Deploy web app
    needs: [test, rules, version]
    if: >-
      needs.version.outputs.changed == 'true' &&
      inputs.platform != 'android'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - name: Check secrets
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is not set"
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew --no-daemon :composeApp:wasmJsBrowserDistribution
        working-directory: kmp
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Safari 27.2 shows a white page if Skia is reached through tail calls.
      - run: node tools/check-tail-calls.mjs composeApp/build/dist/wasmJs/productionExecutable
        working-directory: kmp
      # Fills in the offline cache list; without it the app needs a
      # connection to open.
      - run: node tools/offline.mjs composeApp/build/dist/wasmJs/productionExecutable
        working-directory: kmp
      - run: npm install -g firebase-tools
      - name: Deploy
        run: |
          key="$RUNNER_TEMP/service-account.json"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key")
          GOOGLE_APPLICATION_CREDENTIALS="$key" \
            firebase deploy --only hosting --non-interactive

  distribute:
    name: Distribute Android
    needs: [test, rules, version]
    # inputs.platform is empty on a push.
    if: >-
      needs.version.outputs.changed == 'true' &&
      inputs.platform != 'web'
    runs-on: ubuntu-latest
    concurrency:
      group: distribute-android
      cancel-in-progress: false
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'friends_android' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The release notes list every commit in the push.
          fetch-depth: 0
      # Without the release key the APK would be signed with this runner's
      # throwaway debug key and would not install over the previous build.
      - name: Check secrets
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                      ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD FIREBASE_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Copying base64 into the secrets form can wrap it or add spaces,
      # which `base64 -d` rejects; drop them.
      - name: Write signing key
        run: |
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' \
               | base64 -d > "$RUNNER_TEMP/upload.jks" \
             || [ ! -s "$RUNNER_TEMP/upload.jks" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 — paste the output of 'base64 -i release.jks' again"
            exit 1
          fi
          cat > kmp/androidApp/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew --no-daemon :androidApp:assembleRelease
        working-directory: kmp
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g firebase-tools
      - name: Upload to App Distribution
        env:
          BEFORE: ${{ github.event.before }}
        run: tool/distribute.sh android
