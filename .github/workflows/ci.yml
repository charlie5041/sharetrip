name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          # Same SDK as BabyCalendar, so both apps build on the family Mac.
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
