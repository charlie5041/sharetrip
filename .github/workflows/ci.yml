name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Sends main to testers again without a version bump, for a distribute
  # job that failed for a reason outside the code (the Mac asleep, a
  # keychain problem). Run it from the Actions tab on main.
  workflow_dispatch:
    inputs:
      platform:
        description: Which build to send
        type: choice
        options: [both, ios, android]
        default: both

jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          # Same SDK as BabyCalendar, so both apps build on the family Mac.
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # firebase-tools needs Java 21 or later for the emulator.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm install
        working-directory: test/rules
      - run: npm test
        working-directory: test/rules

  # Did this push to main change `version` in pubspec.yaml? Raising the
  # build number is what ships a build to testers; other pushes don't.
  version:
    name: Version changed
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: compare
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(sed -n 's/^version: *//p' pubspec.yaml)
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            was=$(git show "$BEFORE:pubspec.yaml" | sed -n 's/^version: *//p')
          else
            was=
          fi
          echo "version: ${was:-unknown} -> $now"
          if [ "$was" = "$now" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $now unchanged; not distributing"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Every push to main publishes main's firestore.rules once the rules
  # tests pass, so a rules change can't be merged and forgotten: a write the
  # live rules refuse is dropped without anyone seeing an error. Setup (the
  # service account's roles) is in README → 發布設定.
  deploy-rules:
    name: Deploy Firestore rules
    needs: [rules]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-rules
      cancel-in-progress: false
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - name: Check secrets
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is not set"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g firebase-tools
      - name: Deploy
        run: |
          key="$RUNNER_TEMP/service-account.json"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key")
          GOOGLE_APPLICATION_CREDENTIALS="$key" \
            firebase deploy --only firestore:rules --non-interactive

  distribute:
    name: Distribute Android
    needs: [flutter, rules, version]
    # inputs.platform is empty on a push.
    if: needs.version.outputs.changed == 'true' && inputs.platform != 'ios'
    runs-on: ubuntu-latest
    concurrency:
      group: distribute-android
      cancel-in-progress: false
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'friends' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The release notes list every commit in the push.
          fetch-depth: 0
      # Without the release key the APK would be signed with this runner's
      # throwaway debug key and would not install over the previous build.
      - name: Check secrets
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                      ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD FIREBASE_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      # Copying base64 into the secrets form can wrap it or add spaces,
      # which `base64 -d` rejects; drop them.
      - name: Write signing key
        run: |
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' \
               | base64 -d > "$RUNNER_TEMP/upload.jks" \
             || [ ! -s "$RUNNER_TEMP/upload.jks" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 — paste the output of 'base64 -i release.jks' again"
            exit 1
          fi
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS
      - uses: gradle/actions/setup-gradle@v5
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g firebase-tools
      - name: Upload to App Distribution
        env:
          BEFORE: ${{ github.event.before }}
        run: tool/distribute.sh android

  # Builds on the family Mac (a self-hosted runner registered to this
  # repository, so macOS minutes cost nothing), development-signed for the
  # Apple team's registered iPhones, and sent through App Distribution.
  # Setup is in README → 發布設定.
  distribute-ios:
    name: Distribute iOS
    needs: [flutter, rules, version]
    # Off until the sharetrip runner and iOS secrets are set up: without a
    # runner the job would sit queued for a day. Turn on with the repo
    # variable IOS_DISTRIBUTION = true.
    if: >-
      needs.version.outputs.changed == 'true' && inputs.platform != 'android' &&
      vars.IOS_DISTRIBUTION == 'true'
    runs-on: [self-hosted, macOS]
    concurrency:
      group: distribute-ios
      cancel-in-progress: false
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      TESTER_GROUPS: ${{ vars.FIREBASE_IOS_TESTER_GROUPS || 'friends_ios' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check secrets
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is not set"
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - run: flutter pub get
      # The runner is a background service, which cannot use the login
      # keychain's private keys; see tool/ios_keychain.sh.
      - name: Set up the signing keychain
        env:
          IOS_SIGNING_P12: ${{ secrets.IOS_SIGNING_P12 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
        run: tool/ios_keychain.sh setup
      # A failed Xcode step shows only a bare line; the reason is in the
      # verbose output, which goes to a file and is filtered on failure.
      - name: Build IPA
        run: |
          log="$RUNNER_TEMP/build-ipa.log"
          if flutter build ipa --release --verbose \
               --export-options-plist=ios/ExportOptions.plist > "$log" 2>&1; then
            tail -n 5 "$log"
            exit 0
          fi
          echo "---- Lines naming the error ----"
          grep -n -i -E 'error:|errSec|failed|CodeSign|provisioning profile|certificate' "$log" \
            | grep -v -i 'warning:' | tail -n 150
          echo "::group::End of the build output"
          tail -n 80 "$log"
          echo "::endgroup::"
          exit 1
      - name: Remove the signing keychain
        if: always()
        run: tool/ios_keychain.sh cleanup
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          npm install -g firebase-tools
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
      - name: Upload to App Distribution
        env:
          BEFORE: ${{ github.event.before }}
        run: tool/distribute.sh ios
      - name: Remove the service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
