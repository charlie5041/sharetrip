name: sharetrip
description: "Trip planning and expense splitting for a group of friends."
publish_to: 'none'
version: 0.1.0+5

environment:
  sdk: ^3.13.4

dependencies:
  cloud_firestore: ^6.10.2
  firebase_auth: ^6.7.1
  firebase_core: 4.15.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.4.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.4.0

flutter:
  uses-material-design: true
  fonts:
    # Huninn (粉圓), SIL OFL 1.1 — see assets/fonts/OFL.txt. Bundled so
    # the app looks right offline, abroad, on first launch.
    - family: Huninn
      fonts:
        - asset: assets/fonts/Huninn-Regular.ttf
