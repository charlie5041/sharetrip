name: sharetrip
description: "Trip planning and expense splitting for a group of friends."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Huninn (粉圓), SIL OFL 1.1 — see assets/fonts/OFL.txt. Bundled so
    # the app looks right offline, abroad, on first launch.
    - family: Huninn
      fonts:
        - asset: assets/fonts/Huninn-Regular.ttf
